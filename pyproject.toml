[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voicechess"
version = "0.3.0"
description = "VoiceChess robot subsystems"
requires-python = ">=3.11,<3.12"
dependencies = ["click>=8.1,<9", "loguru>=0.7,<0.8"]

[project.optional-dependencies]
voice = ["PyAudio==0.2.14", "vosk==0.3.45", "webrtcvad-wheels>=2.0.14,<3", "numpy==1.26.4", "soxr>=1.0,<2"]
vision = ["opencv-python==4.9.0.80", "numpy==1.26.4"]
game = ["python-chess>=1.999,<2"]
wakeword = ["openwakeword==0.6.0", "onnxruntime==1.18.0", "numpy==1.26.4"]

[project.scripts]
voice = "voice.cli:cli"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
include = ["voice*"]
exclude = ["voice.tests*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires a real Vosk model", "hardware: opens a physical microphone"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["voice/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "T20"]

[tool.ruff.format]
quote-style = "double"
