; platformio.ini para compilar o firmware principal do ESP32
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
